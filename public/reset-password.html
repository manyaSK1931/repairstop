<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password – RepairStop</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="app" data-page="reset">
<div id="chrome-nav"></div>
<main>
<div class="container narrow"><div class="card stack">
<div><div class="eyebrow">Password help</div><h1 style="font-size:28px">Create a new password</h1></div>
<div id="msg" class="hidden"></div>
<form id="resetForm" class="stack hidden" novalidate>
<div class="field"><label for="password">New password</label><div class="pw"><input id="password" name="password" type="password" autocomplete="new-password" required><button type="button" aria-label="Show or hide password">Show</button></div><div class="err"></div></div>
<div class="hint">At least 8 characters with upper and lower case letters, a number and a special character.</div>
<div class="field"><label for="confirmPassword">Confirm new password</label><div class="pw"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required><button type="button" aria-label="Show or hide password">Show</button></div><div class="err"></div></div>
<button class="btn primary block" type="submit">Update password</button>
</form>
<div id="again" class="hidden muted" style="text-align:center"><a href="/forgot-password" style="color:var(--orange);font-weight:700">Request a new reset link</a></div>
</div></div>
</main>
<div id="chrome-foot"></div>
<script src="/js/common.js"></script>
<script src="/js/auth.js?v=2"></script>
</body>
</html>
