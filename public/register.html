<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account – RepairStop</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="app" data-page="register">
<div id="chrome-nav"></div>
<main>
<div class="container narrow"><div class="card stack">
<div><div class="eyebrow">Join RepairStop</div><h1 style="font-size:28px">Create your account</h1><p class="lead" style="font-size:15px">Create an account and log in right away.</p></div>
<div id="msg" class="hidden"></div>
<form id="registerForm" class="stack" novalidate>
<div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" type="text" autocomplete="name" required maxlength="100"><div class="err"></div></div>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err"></div></div>
<div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required placeholder="10-digit mobile number"><div class="err"></div></div>
<div class="field"><label for="password">Password</label><div class="pw"><input id="password" name="password" type="password" autocomplete="new-password" required><button type="button" aria-label="Show or hide password">Show</button></div><div class="err"></div></div>
<div class="hint">At least 8 characters with upper and lower case letters, a number and a special character.</div>
<div class="field"><label for="confirmPassword">Confirm password</label><div class="pw"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required><button type="button" aria-label="Show or hide password">Show</button></div><div class="err"></div></div>
<button class="btn primary block" type="submit">Register</button>
</form>
<div class="muted" style="text-align:center">Already have an account? <a href="/login" style="color:var(--orange);font-weight:700">Log in</a></div>
</div></div>
</main>
<div id="chrome-foot"></div>
<script src="/js/common.js"></script>
<script src="/js/auth.js?v=2"></script>
</body>
</html>
